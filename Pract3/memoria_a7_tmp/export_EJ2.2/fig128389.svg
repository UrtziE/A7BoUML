	<polygon fill="#c0ffff" stroke="black" stroke-opacity="1" points="65,396 384,396 384,406 394,406 394,625 65,625 65,396" />
	<line stroke="black" stroke-opacity="1" x1="384" y1="396" x2="394" y2="406" />
	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="75" y="433">Controlador principal de la</text>
	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="75" y="460">aplicación. Sus manejadores de</text>
	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="75" y="487">evento abren cada caso de</text>
	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="75" y="514">uso; el de entregar vehículo</text>
	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="75" y="541">reservado es el que inicia este.</text>
</g>
<g>
	<polygon fill="#c0ffff" stroke="black" stroke-opacity="1" points="881,297 1200,297 1200,307 1210,307 1210,498 881,498 881,297" />
