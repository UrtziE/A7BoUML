	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="891" y="334">Es la clase base de todos los</text>
	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="891" y="361">controladores. Su método</text>
	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="891" y="388">initCasoDeUso carga la vista,</text>
	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="891" y="415">crea el controlador y asocia su</text>
	<text font-family="MS Shell Dlg 2" font-size="11" fill="#000000" xml:space="preserve" x="891" y="442">ventana (Stage).</text>
</g>
